<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Mahasiswa</title>
</head>
<body>

    <h1>BIODATA MAHASISWA</h1>

    <form>
        <label for="nim">NIM</label><br>
        <input type="text" id="nim" name="nim"><br><br>

        <label for="nama">Nama Lengkap</label><br>
        <input type="text" id="nama" name="nama" required><br><br>

        <label for="email">Email</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="tanggal">Tanggal Lahir</label><br>
        <input type="date" id="tanggal" name="tanggal"><br><br>

        <label>Jenis Kelamin</label><br>
        <input type="radio" id="laki" name="jenis_kelamin" value="Laki-laki">
        <label for="laki">Laki-laki</label>

        <input type="radio" id="perempuan" name="jenis_kelamin" value="Perempuan">
        <label for="perempuan">Perempuan</label>
        <br><br>

        <input type="submit" value="SIMPAN">
    </form>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minat Teknologi Mahasiswa</title>
</head>
<body>

    <h1>MINAT TEKNOLOGI MAHASISWA</h1>

    <form>
        <label for="nama">Nama</label><br>
        <input type="text" id="nama" name="nama" required><br><br>

        <label>Pilih Minat:</label><br>

        <input type="checkbox" id="web" name="minat" value="Web Development">
        <label for="web">Web Development</label><br>

        <input type="checkbox" id="ai" name="minat" value="Artificial Intelligence">
        <label for="ai">Artificial Intelligence</label><br>

        <input type="checkbox" id="mobile" name="minat" value="Mobile Development">
        <label for="mobile">Mobile Development</label><br>

        <input type="checkbox" id="game" name="minat" value="Game Development">
        <label for="game">Game Development</label><br>

        <input type="checkbox" id="cyber" name="minat" value="Cyber Security">
        <label for="cyber">Cyber Security</label><br><br>

        <input type="submit" value="SIMPAN">
    </form>

</body>
</html>
